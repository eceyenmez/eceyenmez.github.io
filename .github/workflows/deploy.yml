
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # 🔧 Build your site. Ensure this writes to ./out
      # If your framework outputs to a different dir (e.g., dist),
      # update the next steps to use that path.
      - name: Build
        run: npm run build

      # ✅ Ensure the output directory exists (defensive)
      - name: Ensure output directory exists
        run: mkdir -p out

      # 🚫 Prevent GitHub Pages from running Jekyll
      - name: Add .nojekyll to output
        run: touch out/.nojekyll

      # 🌐 Set custom domain to ece.dev
      - name: Add CNAME file
        run: echo "ece.dev" > out/CNAME

      # 🔍 Optional: Verify contents before upload
      - name: List output files
        run: ls -la out

      # 🧩 Configure Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # 📦 Upload the site artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
